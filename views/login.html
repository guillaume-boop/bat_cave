<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-container">
    <h1>Connexion</h1>
    <form id="login-form">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" class="form-control" required>

      <label>Mot de passe</label>
      <input type="password" name="password" class="form-control" required>

      <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>

    <div id="twofa" class="hidden">
      <div id="twofa-qr-block" class="hidden">
        <p>Double authentification obligatoire : scannez ce QR code pour la configurer.</p>
        <img id="twofa-qr" alt="QR code 2FA">
      </div>
      <form id="code-form">
        <label>Code à 6 chiffres</label>
        <input type="text" name="code" class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
        <button type="submit" class="btn btn-primary">Valider le code</button>
      </form>
    </div>

    <p id="login-message"></p>

    <div class="oauth-divider"><span>ou</span></div>
    <a href="/auth/login/google" class="btn-google">Se connecter avec Google</a>

    <p class="auth-switch">Pas encore de compte ? <a href="/auth/register">S'inscrire</a></p>
  </div>

  <script src="/script.js"></script>
  <script src="/login.js"></script>
</body>
</html>
