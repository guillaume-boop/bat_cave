<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat-Ordinateur</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>
    <div class="container">
      <div class="welcome-msg">
        <h1 id="welcome-text">Bienvenue, Justicier {{username}} !</h1>
      </div>

      <h2 class="arsenal-title">Arsenal</h2>
      <div class="gadgets-grid" id="gadgets-container"></div>

      <div class="report-section">
        <h3>Enregistrer une mission</h3>
        <form id="report-form">
          <div class="mb-3">
            <textarea class="form-control" id="report-content" placeholder="Décrivez votre mission..." rows="4" required></textarea>
          </div>
          <button type="submit" class="btn w-100">Soumettre le rapport</button>
          <p id="report-message"></p>
        </form>
      </div>

      <div class="logout-section">
        <a href="#" id="logout-btn">Se déconnecter</a>
      </div>
    </div>

    <script src="/script.js"></script>
    <script src="/bat-computer.js"></script>
  </body>
</html>
