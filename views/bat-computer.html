<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bat-Ordinateur</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
  </head>

  <body>
    <div class="container">
      <div class="welcome-msg">
        <h1 id="welcome-text">Bienvenue, Justicier {{username}} !</h1>
      </div>

      <h2 class="arsenal-title">Arsenal</h2>
      <div class="gadgets-grid" id="gadgets-container"></div>

      <div class="report-section">
        <h3>Enregistrer une mission</h3>
        <form id="report-form">
          <div class="mb-3">
            <textarea class="form-control" id="report-content" placeholder="Décrivez votre mission..." rows="4" required></textarea>
          </div>
          <button type="submit" class="btn w-100">Soumettre le rapport</button>
          <p id="report-message"></p>
        </form>
      </div>

      <div class="logout-section">
        <a href="/auth/logout">Se déconnecter</a>
      </div>
    </div>

    <script>
      document.getElementById('welcome-text').innerText = 'Bienvenue, Justicier {{username}} !'

      const gadgets = [
        { name: 'Grapnel Hook', desc: 'Crochet de rappel pour escalader les bâtiments', icon: 'fa-hook' },
        { name: 'Batarang', desc: 'Arme de jet en forme de chauve-souris', icon: 'fa-star' },
        { name: 'Smoke Pellet', desc: 'Grenade fumigène pour s\'échapper', icon: 'fa-cloud' },
        { name: 'Sonar Tracker', desc: 'Détecteur de mouvement avancé', icon: 'fa-wifi' },
        { name: 'Night Vision Goggles', desc: 'Lunettes de vision nocturne', icon: 'fa-eye' },
        { name: 'Grappling Gun', desc: 'Pistolet à grappin haute puissance', icon: 'fa-gun' }
      ]

      function loadGadgets() {
        const container = document.getElementById('gadgets-container')
        container.innerHTML = gadgets.map(g => `
          <div class="gadget-card">
            <i class="fas ${g.icon}"></i>
            <h5>${g.name}</h5>
            <p>${g.desc}</p>
          </div>
        `).join('')
      }

      document.getElementById('report-form').onsubmit = async e => {
        e.preventDefault()
        const content = document.getElementById('report-content').value

        try {
          const response = await fetch('/report', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content })
          })

          const messageEl = document.getElementById('report-message')
          if (response.ok) {
            const data = await response.json()
            messageEl.style.color = '#00d4ff'
            messageEl.innerText = data.message
            document.getElementById('report-content').value = ''
          } else {
            const data = await response.json()
            messageEl.style.color = 'red'
            messageEl.innerText = data.error || 'Erreur lors de l\'enregistrement.'
          }
        } catch (err) {
          console.error('Erreur:', err)
          document.getElementById('report-message').style.color = 'red'
          document.getElementById('report-message').innerText = 'Erreur réseau'
        }
      }

      loadGadgets()
    </script>
    <script src="/script.js"></script>
  </body>
</html>
