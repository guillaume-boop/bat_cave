<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-container">
    <h1>Créer un compte</h1>
    <form id="register-form">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" class="form-control" required>

      <label>Mot de passe</label>
      <input type="password" name="password" class="form-control" minlength="6" required>

      <button type="submit" class="btn btn-primary">S'inscrire</button>
      <p id="register-message"></p>
    </form>
    <p class="auth-switch">Déjà un compte ? <a href="/auth/login">Se connecter</a></p>
  </div>

  <script src="/script.js"></script>
  <script>
    document.getElementById('register-form').onsubmit = async e => {
      e.preventDefault()
      const username = e.target.username.value
      const password = e.target.password.value

      // fetch direct : le compte connecte l'utilisateur, on file au bat-computer
      const response = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })

      if (response.ok) {
        window.location.href = '/bat-computer'
      } else {
        const data = await response.json()
        showMessage('register-message', data.error || 'Erreur lors de l\'inscription', 'error')
      }
    }
  </script>
</body>
</html>
