<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-container">
    <h1>Créer un compte</h1>
    <form id="register-form">
      <label>Nom d'utilisateur</label>
      <input type="text" name="username" class="form-control" required>

      <label>Mot de passe</label>
      <input type="password" name="password" class="form-control" minlength="6" required>

      <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>

    <div id="twofa-setup" class="hidden">
      <p>Sécurisez votre compte : scannez ce QR code avec votre application d'authentification.</p>
      <img id="twofa-qr" alt="QR code 2FA">
      <form id="confirm-form">
        <label>Code à 6 chiffres</label>
        <input type="text" name="code" class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="000000">
        <button type="submit" class="btn btn-primary">Activer la 2FA</button>
      </form>
    </div>

    <p id="register-message"></p>
    <p class="auth-switch">Déjà un compte ? <a href="/auth/login">Se connecter</a></p>
  </div>

  <script src="/script.js"></script>
  <script src="/register.js"></script>
</body>
</html>
